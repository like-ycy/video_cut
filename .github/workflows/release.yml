name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Set application version
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wails.json","utf8"));p.info={...(p.info||{}),productVersion:process.env.GITHUB_REF_NAME.slice(1)};fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n");'

      - name: Build macOS app
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -platform darwin/arm64

      - name: Package macOS app
        run: |
          test -d build/bin/videocut.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/videocut.app \
            "videocut-${GITHUB_REF_NAME}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: videocut-*-macos-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Set application version
        run: node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wails.json","utf8"));p.info={...(p.info||{}),productVersion:process.env.GITHUB_REF_NAME.slice(1)};fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n");'

      - name: Build Windows executable
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -platform windows/amd64

      - name: Sign Windows executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            throw 'WINDOWS_SIGNING_PFX_BASE64 secret is not configured'
          }
          if ($null -eq $env:WINDOWS_SIGNING_PFX_PASSWORD) {
            throw 'WINDOWS_SIGNING_PFX_PASSWORD secret is not configured'
          }

          $tempRoot = Join-Path $env:RUNNER_TEMP 'videocut-signing'
          $pfxPath = Join-Path $tempRoot 'signing.pfx'
          $certPath = Join-Path $tempRoot 'signing.cer'
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null

          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
            )

            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $env:WINDOWS_SIGNING_PFX_PASSWORD,
              [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
            )
            [IO.File]::WriteAllBytes(
              $certPath,
              $certificate.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert)
            )
            Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
            Import-Certificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\TrustedPublisher | Out-Null

            $signtool = Get-ChildItem `
              -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signtool) {
              throw 'Windows SDK signtool.exe not found'
            }

            & $signtool.FullName sign `
              /f $pfxPath `
              /p $env:WINDOWS_SIGNING_PFX_PASSWORD `
              /fd SHA256 `
              /tr http://timestamp.digicert.com `
              /td SHA256 `
              build/bin/videocut.exe
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed with exit code $LASTEXITCODE"
            }

            & $signtool.FullName verify /pa /all /v build/bin/videocut.exe
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item -Path $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare Windows artifact
        shell: pwsh
        run: Copy-Item build/bin/videocut.exe "videocut-$env:GITHUB_REF_NAME-windows-amd64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: videocut-*-windows-amd64.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          test "${#assets[@]}" -eq 2

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "videocut $GITHUB_REF_NAME" \
              --generate-notes
          fi
