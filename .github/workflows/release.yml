name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
          - goarch: amd64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Set application version
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wails.json","utf8"));p.info={...(p.info||{}),productVersion:process.env.GITHUB_REF_NAME.slice(1)};fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n");'

      - name: Build macOS app
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 build \
            -clean \
            -platform "darwin/${{ matrix.goarch }}" \
            -ldflags "-X videocut/internal/version.Version=${GITHUB_REF_NAME}"

      - name: Package macOS app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="videocut_${VERSION}_darwin_${{ matrix.goarch }}.tar.gz"
          test -d build/bin/videocut.app
          tar -czf "$PKG" -C build/bin videocut.app

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.goarch }}
          path: videocut_*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Set application version
        run: node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wails.json","utf8"));p.info={...(p.info||{}),productVersion:process.env.GITHUB_REF_NAME.slice(1)};fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n");'

      - name: Build Windows executable
        shell: bash
        # Wails 2.16 的 -o 不会自动补 .exe，因此这里不使用 -o，保持默认输出 build/bin/videocut.exe
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 build \
            -clean \
            -platform windows/amd64 \
            -ldflags "-X videocut/internal/version.Version=${GITHUB_REF_NAME}"

      - name: Package Windows executable
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="videocut_${VERSION}_windows_amd64.tar.gz"
          test -f build/bin/videocut.exe
          tar -czf "$PKG" -C build/bin videocut.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: videocut_*.tar.gz
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.tar.gz)
          test "${#assets[@]}" -eq 3
          for asset in "${assets[@]}"; do
            basename "$asset"
          done

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "videocut $GITHUB_REF_NAME" \
              --generate-notes
          fi
