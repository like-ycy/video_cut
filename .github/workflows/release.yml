name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
          - goarch: amd64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      # 不缓存 Go build cache：Windows 上解压 ~233MB 比冷编译还慢
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Wails CLI
        uses: actions/cache@v6
        with:
          path: .wails-bin
          key: wails-cli-v2.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Wails CLI
        shell: bash
        run: |
          mkdir -p .wails-bin
          if [ ! -f .wails-bin/wails ] && [ ! -f .wails-bin/wails.exe ]; then
            GOBIN="$PWD/.wails-bin" go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          fi
          echo "$PWD/.wails-bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Set application version
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wails.json","utf8"));p.info={...(p.info||{}),productVersion:process.env.GITHUB_REF_NAME.slice(1)};fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n");'

      - name: Build macOS app
        run: |
          wails build \
            -clean \
            -platform "darwin/${{ matrix.goarch }}" \
            -ldflags "-X videocut/internal/version.Version=${GITHUB_REF_NAME}"

      - name: Package macOS app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$PWD/videocut_${VERSION}_darwin_${{ matrix.goarch }}.zip"
          test -d build/bin/videocut.app
          # -y 保留 .app 内符号链接，避免系统解压后损坏应用包
          (cd build/bin && zip -qyr "$PKG" videocut.app)
          test -f "$PKG"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.goarch }}
          path: videocut_*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      # 不缓存 Go build cache：Windows 上解压 ~233MB 比冷编译还慢
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Wails CLI
        uses: actions/cache@v6
        with:
          path: .wails-bin
          key: wails-cli-v2.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Wails CLI
        shell: bash
        run: |
          mkdir -p .wails-bin
          if [ ! -f .wails-bin/wails ] && [ ! -f .wails-bin/wails.exe ]; then
            GOBIN="$PWD/.wails-bin" go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          fi
          echo "$PWD/.wails-bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Set application version
        run: node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("wails.json","utf8"));p.info={...(p.info||{}),productVersion:process.env.GITHUB_REF_NAME.slice(1)};fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n");'

      - name: Build Windows executable
        shell: bash
        # Wails 2.16 的 -o 不会自动补 .exe，因此这里不使用 -o，保持默认输出 build/bin/videocut.exe
        run: |
          wails build \
            -clean \
            -platform windows/amd64 \
            -ldflags "-X videocut/internal/version.Version=${GITHUB_REF_NAME}"

      - name: Package Windows executable
        # 在 exe 所在目录打包，保证 zip 根目录就是 videocut.exe，
        # 避免 Compress-Archive 写入 build/bin/... 导致更新器两层内找不到文件。
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME.Substring(1)
          $PKG = Join-Path $PWD "videocut_${VERSION}_windows_amd64.zip"
          if (-not (Test-Path "build/bin/videocut.exe")) { throw "missing videocut.exe" }
          Push-Location "build/bin"
          try {
            Compress-Archive -Path "videocut.exe" -DestinationPath $PKG -Force
          } finally {
            Pop-Location
          }
          if (-not (Test-Path $PKG)) { throw "failed to create $PKG" }
          # 校验 zip 根目录条目
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($PKG)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\','/' })
            if ($names -notcontains "videocut.exe") {
              throw "zip root missing videocut.exe; entries: $($names -join ', ')"
            }
          } finally {
            $zip.Dispose()
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: videocut_*.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          shopt -s nullglob
          packages=(release-assets/*.zip)
          test "${#packages[@]}" -eq 3
          (
            cd release-assets
            sha256sum *.zip > SHA256SUMS.txt
          )
          echo "SHA256SUMS:"
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/SHA256SUMS.txt)
          test "${#assets[@]}" -eq 4
          for asset in "${assets[@]}"; do
            basename "$asset"
          done

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "videocut $GITHUB_REF_NAME" \
              --generate-notes
          fi
