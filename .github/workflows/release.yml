name: Release

# 构建与打包全部收在 tools/build.sh（macOS）与 tools\build.ps1（Windows）里，
# 这里只负责「换平台 → 调脚本 → 断言产物 → 传 artifact」。
#
# 产物命名（与 go/internal/updater 的资产匹配一致）：
#   videocut_<ver>_<goos>_<goarch>.zip
# 平台段取 GOOS，不要写成 "macos"。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-15
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: windows
            goarch: amd64
            runner: windows-2022

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: go/frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: tools/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\build.ps1

      # 结构断言：更新器解压后按「zip 根唯一的 .app / .exe」找目标，
      # 多套一层目录会让它找不到文件，而构建日志一片绿。
      - name: Assert layout
        shell: bash
        run: |
          set -euo pipefail
          version="$(git describe --tags --exact-match | sed 's/^v//')"
          asset="dist/release/videocut_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          test -f "$asset" || { echo "缺少归档：$asset"; ls -R dist/release; exit 1; }

          names="$(unzip -Z1 "$asset" 2>/dev/null || python3 -c 'import zipfile,sys;print("\n".join(zipfile.ZipFile(sys.argv[1]).namelist()))' "$asset")"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            echo "$names" | grep -q "^videocut\.app/Contents/MacOS/videocut$" ||
              { echo "归档里没有 .app 内的可执行文件"; echo "$names" | head -20; exit 1; }
          else
            echo "$names" | grep -qx "videocut.exe" || { echo "归档根缺少 videocut.exe"; exit 1; }
          fi
          stray="$(echo "$names" | grep -v "^videocut" || true)"
          if [ -n "$stray" ]; then echo "归档顶层出现多余条目：$stray"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: videocut-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          shopt -s nullglob
          packages=(release-assets/*.zip)
          test "${#packages[@]}" -eq 3 || { echo "应有 3 个包，实际 ${#packages[@]}"; ls release-assets; exit 1; }
          (
            cd release-assets
            sha256sum *.zip > SHA256SUMS.txt
          )
          echo "SHA256SUMS:"
          cat release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/SHA256SUMS.txt)
          test "${#assets[@]}" -eq 4
          for asset in "${assets[@]}"; do
            basename "$asset"
          done

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "videocut $GITHUB_REF_NAME" \
              --generate-notes
          fi
