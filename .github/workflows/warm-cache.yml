name: Warm Cache

# 在 main 上预热 Go / npm / Wails CLI 缓存。
# tag 发布只能读到当前 tag 或默认分支上的缓存，不预热则每次发版都是冷启动。
on:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/warm-cache.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  schedule:
    # GitHub 会回收 7 天未访问的缓存，每周补一次
    - cron: '17 2 * * 1'

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Cache Wails CLI
        uses: actions/cache@v6
        with:
          path: .wails-bin
          key: wails-cli-v2.16.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Wails CLI
        shell: bash
        run: |
          mkdir -p .wails-bin
          if [ ! -f .wails-bin/wails ] && [ ! -f .wails-bin/wails.exe ]; then
            GOBIN="$PWD/.wails-bin" go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          fi
          echo "$PWD/.wails-bin" >> "$GITHUB_PATH"

      - name: Verify Wails CLI
        shell: bash
        run: wails version
